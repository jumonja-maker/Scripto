name: Windows release

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - src/scriptolib/__init__.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scriptolib-stable-release
  cancel-in-progress: false

jobs:
  test:
    if: >-
      github.repository == 'jumonja-maker/Scripto' &&
      toJSON(github.event.repository.private) == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate version
        id: version
        run: |
          python - <<'PY'
          import os, re, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          source = Path('src/scriptolib/__init__.py').read_text()
          match = re.search(r'^__version__ = "([^"]+)"$', source, re.MULTILINE)
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version) or not match or match[1] != version:
              raise SystemExit('Both source versions must match stable X.Y.Z')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - name: Install Qt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0 libgl1 libxkbcommon0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libxcb-cursor0
          python -m pip install -e . pytest
      - name: Test library, UI, storage and updates
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: python -B -m pytest -q

  publish:
    needs: test
    if: >-
      github.repository == 'jumonja-maker/Scripto' &&
      toJSON(github.event.repository.private) == 'false' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 nsis
      - name: Build Windows installer and update package
        env:
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: python scripts/build_windows.py --version "$RELEASE_VERSION"
      - name: Upload draft, verify assets, publish and verify latest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.test.outputs.version }}
        run: python -B scripts/publish_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --directory dist
